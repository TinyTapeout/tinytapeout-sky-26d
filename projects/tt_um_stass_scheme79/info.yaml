# Tiny Tapeout project information
project:
  title:        "Scheme-79: the 1979 MIT Lisp chip"      # Project title
  author:       "Stanislav Sedov"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "The SCHEME-79 chip of MIT AI Memo 559, which evaluates S-code and collects its garbage; RP2350 serves its list memory"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_stass_scheme79"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "s79_core.v"
    - "s79_pads.v"
    - "s79_micro_pla.v"
    - "s79_nano_pla.v"
    - "s79_control_pla.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "RX[0]"
  ui[1]: "RX[1]"
  ui[2]: "RX[2]"
  ui[3]: "RX[3]"
  ui[4]: "RX[4]"
  ui[5]: "RX[5]"
  ui[6]: "RX[6]"
  ui[7]: "RX[7]"

  # Outputs
  uo[0]: "TX[0]/UPC[0]/SEG_A"
  uo[1]: "TX[1]/UPC[1]/SEG_B"
  uo[2]: "TX[2]/UPC[2]/SEG_C"
  uo[3]: "TX[3]/UPC[3]/SEG_D"
  uo[4]: "TX[4]/UPC[4]/SEG_E"
  uo[5]: "TX[5]/UPC[5]/SEG_F"
  uo[6]: "TX[6]/UPC[6]/SEG_G"
  uo[7]: "TX[7]/UPC[7]/SEG_DP"

  # Bidirectional pins
  uio[0]: "TX_VALID"
  uio[1]: ""
  uio[2]: ""
  uio[3]: "RX_READY"
  uio[4]: "IRQ"
  uio[5]: "DONE"
  uio[6]: "GC_NEEDED"
  uio[7]: "UPC[8]"

# Do not change!
yaml_version: 6
