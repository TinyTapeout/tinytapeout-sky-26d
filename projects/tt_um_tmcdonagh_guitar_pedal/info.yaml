# Tiny Tapeout project information
project:
  title:        "Silicon Guitar Pedal"        # Project title
  author:       "Thomas McDonagh"      # Your name
  discord:      "dedicatedhippo"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Multi-effect DSP guitar pedal: I2S in, selectable fuzz/distortion/ring mod/tremolo/bitcrusher, LED meter" # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     24576000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tmcdonagh_guitar_pedal"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_tmcdonagh_guitar_pedal.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "I2S ADC data in"
  ui[1]: "mode select bit 0"
  ui[2]: "mode select bit 1"
  ui[3]: "mode select bit 2"
  ui[4]: "parameter bit 0"
  ui[5]: "parameter bit 1"
  ui[6]: "parameter bit 2"
  ui[7]: "parameter bit 3"

  # Outputs
  uo[0]: "I2S DAC data out"
  uo[1]: "LED bar bit 0"
  uo[2]: "LED bar bit 1"
  uo[3]: "LED bar bit 2"
  uo[4]: "LED bar bit 3"
  uo[5]: "LED bar bit 4"
  uo[6]: "I2S BCLK (master, 3.072 MHz)"
  uo[7]: "I2S LRCLK/WS (master, 48 kHz)"

  # Bidirectional pins
  uio[0]: "MCLK (24.576 MHz output)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
