# Tiny Tapeout project information
project:
  title:        "BPX-1 branch prediction coprocessor"      # Project title
  author:       "Kyrylo Nazarevych, Märten Erik Loor, Ilma Kule, Vitalii Haponenko"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Stand-alone conditional-branch direction predictor: a hashed perceptron and three classic references, with an asynchronous host port and an SPI control port"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     30303030       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kyrylo_nazarevych_bpx1"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "bpx_ltab.v"
    - "bpx_pred.v"
    - "bpx_core.v"
    - "bpx_spi.v"
    - "bpx_ro.v"
    - "bpx_chip.v"
    - "tt_um_kyrylo_nazarevych_bpx1.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "ID[0] branch identifier"
  ui[1]: "ID[1]"
  ui[2]: "ID[2]"
  ui[3]: "ID[3]"
  ui[4]: "ID[4]"
  ui[5]: "ID[5]"
  ui[6]: "ID[6]"
  ui[7]: "ID[7]"

  # Outputs
  uo[0]: "ACK (toggles once per request)"
  uo[1]: "PRED (prediction of the driving predictor)"
  uo[2]: "CONF (confidence of the driving predictor)"
  uo[3]: "FULL (in-flight queue full)"
  uo[4]: "READY"
  uo[5]: "DBG0 (selectable event; after reset: last prediction of the default predictor)"
  uo[6]: "DBG1 (selectable event; after reset: last prediction of the tournament)"
  uo[7]: "MISO (control port)"

  # Bidirectional pins
  uio[0]: "PBIM (output: last prediction of the bimodal predictor)"
  uio[1]: "PGSH (output: last prediction of the gshare predictor)"
  uio[2]: "OP[0] (input)"
  uio[3]: "OP[1] (input)"
  uio[4]: "CSn (control port, input)"
  uio[5]: "SCK (control port, input)"
  uio[6]: "MOSI (control port, input)"
  uio[7]: "REQ (toggles once per request, input)"

# Do not change!
yaml_version: 6
