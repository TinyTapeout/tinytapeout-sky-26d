  ui[0]: "I0"
  ui[1]: "I1"
  ui[2]: "I2"
  ui[3]: "I3"
  ui[4]: "I4"
  ui[5]: "LEAK_FAST"
  ui[6]: "THRESH0"
  ui[7]: "THRESH1"

  # Outputs
  uo[0]: "SEG_LVL7"
  uo[1]: "SEG_LVL6"
  uo[2]: "SEG_LVL3"
  uo[3]: "SEG_LVL1"
  uo[4]: "SEG_LVL2"
  uo[5]: "SEG_LVL5"
  uo[6]: "SEG_LVL4"
  uo[7]: "SPIKE"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

