# Tiny Tapeout project information
project:
  title:        "BWSI bASICs MNIST NN"      # Project title
  author:       "Simran Kaur"      # Your name
  discord:      "simran__kaur"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Classifies 7x7 handwritten digits with a 49-40-20-10 int4-weight neural network, weights streamed in"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kaursome10_run_nn"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "nn_core.v"


# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  ui[0]: "pixel[0]"
  ui[1]: "pixel[1]"
  ui[2]: "pixel[2]"
  ui[3]: "pixel[3]"
  ui[4]: "pixel[4]"
  ui[5]: "pixel[5]"
  ui[6]: "pixel[6]"
  ui[7]: "pixel[7]"

  uo[0]: "digit[0]"
  uo[1]: "digit[1]"
  uo[2]: "digit[2]"
  uo[3]: "digit[3]"
  uo[4]: "done"
  uo[5]: "ready"
  uo[6]: "layer[0]"
  uo[7]: "layer[1]"

  uio[0]: "start"
  uio[1]: "in_valid"
  uio[2]: ""
  uio[3]: ""
  uio[4]: "weight[0]"
  uio[5]: "weight[1]"
  uio[6]: "weight[2]"
  uio[7]: "weight[3]"

# Do not change!
yaml_version: 6
