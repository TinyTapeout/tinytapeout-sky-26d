# Tiny Tapeout project information
project:
  title:        "Simple comb filter using PMODs AD1 & DA3"      # Project title
  author:       "Fabián Alberto Picado García"      # Your name
  discord:      "fabianpicado"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Feedforward comb filter using PMODs AD1 & DA3 at a configurable sampling frequency"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     5000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_fabianpg3_comb_filter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_fabianpg3_comb_filter.sv"
    - "ad1_capture_top.sv"
    - "ad1_programmer_fsm.sv"
    - "comb_filter_adder.sv"
    - "comb_filter_center.sv"
    - "comb_filter_core.sv"
    - "comb_filter_dac_mapper.sv"
    - "comb_filter_register.sv"
    - "comb_filter_top.sv"
    - "da3_ldac_cs_controller.sv"
    - "da3_output_top.sv"
    - "da3_programmer_fsm.sv"
    - "spi_master.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PMOD AD1 d0"
  ui[1]: "PMOD AD1 d1"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PMOD DA3 ldac_n"
  uo[1]: ""
  uo[2]: "PMOD DA3 din"
  uo[3]: "PMOD DA3 sclk"
  uo[4]: "PMOD DA3 cs_n"
  uo[5]: "PMOD AD1 cs_n"
  uo[6]: "PMOD AD1 sclk"
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
