pinout:
  # Inputs
  ui[0]: "A"
  ui[1]: "B"
  ui[2]: "IN2"
  ui[3]: "IN3"
  ui[4]: "IN4"
  ui[5]: "IN5"
  ui[6]: "IN6"
  ui[7]: "IN7"

  # Outputs
  uo[0]: "A_AND_B"
  uo[1]: "NOT_B"
  uo[2]: "NOT_IN2"
  uo[3]: "NOT_IN3"
  uo[4]: "COPY_IN4"
  uo[5]: "COPY_IN5"
  uo[6]: "COPY_IN6"
  uo[7]: "COPY_IN7"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

