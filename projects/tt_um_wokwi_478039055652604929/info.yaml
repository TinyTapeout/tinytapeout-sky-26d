# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id: "478039055652604929" # Set this to the ID of your Wokwi project (the number from the project's URL)
  title: "4bit adder" # Project title
  author: "Ingus Valters Briska" # Your name
  discord: ".apusapus" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Asynchronously adds bits 1-4 to 5-8 and outputs as binary" # One line description of what your project does
  language: "Wokwi" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 0 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

