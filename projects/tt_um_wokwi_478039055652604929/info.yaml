  ui[3]: "IN1-3"
  ui[4]: "IN2-0"
  ui[5]: "IN2-1"
  ui[6]: "IN2-2"
  ui[7]: "IN2-3"

  # Outputs
  uo[0]: "OUT-0"
  uo[1]: "OUT-1"
  uo[2]: "OUT-2"
  uo[3]: "OUT-3"
  uo[4]: "OUT-4"
  uo[5]: ""
  uo[6]: ""
