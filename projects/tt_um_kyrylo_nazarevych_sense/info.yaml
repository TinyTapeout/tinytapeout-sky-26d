# Tiny Tapeout project information
project:
  title:        "SXA-1 standard-cell sensor exploration array"      # Project title
  author:       "Kyrylo Nazarevych"      # Your name (the owner will confirm the final list)
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Ring oscillators, leaky nodes, latches, heaters and a delay-line sampler with a counter read-out: experiments on what standard cells sense"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     30303030       # Clock frequency in Hz (or 0 if not applicable): timed for 33 ns; any lower clock works

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kyrylo_nazarevych_sense"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "sp_cells.v"
    - "sp_core.v"
    - "tt_um_kyrylo_nazarevych_sense.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# Names as in docs/REGISTERS.md.
pinout:
  # Inputs
  ui[0]: "RADDR[0] read byte address"
  ui[1]: "RADDR[1]"
  ui[2]: "RADDR[2]"
  ui[3]: "RADDR[3]"
  ui[4]: "RADDR[4]"
  ui[5]: "RBIT[0] bit of the read byte for RAW"
  ui[6]: "RBIT[1]"
  ui[7]: "RBIT[2]"

  # Outputs
  uo[0]: "DATA[0] read byte (chain output at address 2)"
  uo[1]: "DATA[1]"
  uo[2]: "DATA[2]"
  uo[3]: "DATA[3]"
  uo[4]: "DATA[4]"
  uo[5]: "DATA[5]"
  uo[6]: "DATA[6]"
  uo[7]: "DATA[7]"

  # Bidirectional pins
  uio[0]: "CFG_DIN (input: configuration chain data)"
  uio[1]: "CFG_SHIFT (input: chain shift enable)"
  uio[2]: "GATE (input: counters count while high)"
  uio[3]: "LEAK_WE (input: leaky-node write)"
  uio[4]: "LAT_ARM (input: latch arm / force)"
  uio[5]: "DIV_A (output: counter A divided by 32 to 4096)"
  uio[6]: "DIV_B (output: counter B divided by 32 to 4096)"
  uio[7]: "RAW (output: read-byte bit, beat flop or glitch flag)"

# Do not change!
yaml_version: 6
