# Tiny Tapeout project information
project:
  title:        "Busy Beaver 5"      # Project title
  author:       "Simon Tuchman"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "BB(5) busy beaver Turing machine; tape in an external SRAM; WE# pulses 47,176,870 times then halts"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     2000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_chickenwhisperer_bb5"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CLEAR (hold high >= 33000 clocks to zero the tape; run starts when it goes low)"
  ui[1]: "SCAN (after halt, walk the head right to read out the tape)"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "SRAM A0"
  uo[1]: "SRAM A1"
  uo[2]: "SRAM A2"
  uo[3]: "SRAM A3"
  uo[4]: "SRAM A4"
  uo[5]: "SRAM A5"
  uo[6]: "SRAM A6"
  uo[7]: "SRAM A7"

  # Bidirectional pins
  uio[0]: "SRAM A8"
  uio[1]: "SRAM A9"
  uio[2]: "SRAM A10"
  uio[3]: "SRAM A11"
  uio[4]: "SRAM A12"
  uio[5]: "SRAM A13"
  uio[6]: "SRAM I/O0 (tape data, bidirectional)"
  uio[7]: "SRAM WE# (one pulse per step; stops at halt)"

# Do not change!
yaml_version: 6
